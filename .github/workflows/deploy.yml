name: Deploy Unsolved

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6
        with:
          path: potential-fortnight
          persist-credentials: false

      - name: Check out private content
        uses: actions/checkout@v6
        with:
          repository: sambodhic/laughing-fiesta
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: laughing-fiesta
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test, validate, and build
        working-directory: potential-fortnight
        run: |
          python -m unittest discover -s tests
          python manage.py check
          python manage.py build

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: potential-fortnight/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
